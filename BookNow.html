<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Successfully Updated</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="glass-panel glass-panel-small" style="text-align: center;">
        <h1 style="color: var(--accent-green);">Success!</h1>
        <p id="successMsg">Your appointment has been successfully booked.</p>
        <button class="btn btn-primary" onclick="location.href='index.html'" style="margin-top: 20px;"><i class="ph ph-house" style="margin-right: 8px;"></i> Return to Dashboard</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');
            const date = params.get('date');
            const service = params.get('service');
            
            if (name && date && service) {
                document.getElementById('successMsg').innerHTML = 
                    `Thank you, <strong>${name}</strong>!<br><br>` + 
                    `Your <strong>${service}</strong> has been tentatively scheduled for <strong>${date}</strong>.`;
            }
        });
    </script>
</body>
</html>
