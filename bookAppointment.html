<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="top-right-nav">
        <button class="btn btn-blue" onclick="location.href='index.html'"><i class="ph ph-house" style="margin-right: 8px;"></i> Dashboard</button>
    </div>

    <div class="glass-panel glass-panel-small scrollable-page" style="margin-top: 50px;">
        <h2>Book Your Appointment</h2>
        
        <div class="disclaimer-notice">
            <strong>Note:</strong> This is a simulation. No real booking will be made.
        </div>

        <form id="appointmentForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <span id="nameError" class="form-error" style="display: none;">Name is required.</span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <span id="emailError" class="form-error" style="display: none;">Valid email is required.</span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="10-digit number" required>
                <span id="phoneError" class="form-error" style="display: none;">Valid 10-digit phone number is required.</span>
            </div>

            <div class="form-group">
                <label for="date">Appointment Date</label>
                <input type="date" id="date" name="date" required>
                <span id="dateError" class="form-error" style="display: none;">Please select a future date.</span>
            </div>

            <div class="form-group">
                <label for="time">Appointment Time</label>
                <input type="time" id="time" name="time" required>
                <span id="timeError" class="form-error" style="display: none;">Time is required.</span>
            </div>

            <div class="form-group">
                <label for="service">Select Service</label>
                <select id="service" name="service" required style="width: 100%; padding: 15px; border: 2px solid #fff; border-radius: 5px; background: var(--input-bg); color: var(--text-dark); font-size: 1rem;">
                    <option value="">Choose a service</option>
                    <option value="Consultation">Consultation</option>
                    <option value="Checkup">Checkup</option>
                    <option value="Blood Test">Blood Test</option>
                    <option value="Protein Analysis">Protein Analysis</option>
                </select>
                <span id="serviceError" class="form-error" style="display: none;">Service selection is required.</span>
            </div>

            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Any special requests?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="ph ph-calendar-check" style="margin-right: 8px;"></i> Book Now</button>
        </form>
    </div>

    <script>
        // Set minimum date to today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

        document.getElementById('appointmentForm').addEventListener('submit', function (event) {
            event.preventDefault();

            let isValid = true;
            
            // Validate Name
            const name = document.getElementById('name');
            if (!name.value.trim()) {
                document.getElementById('nameError').style.display = 'block';
                name.classList.add('input-error');
                isValid = false;
            } else {
                document.getElementById('nameError').style.display = 'none';
                name.classList.remove('input-error');
            }

            // Validate Email
            const email = document.getElementById('email');
            const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
            if (!emailRegex.test(email.value)) {
                document.getElementById('emailError').style.display = 'block';
                email.classList.add('input-error');
                isValid = false;
            } else {
                document.getElementById('emailError').style.display = 'none';
                email.classList.remove('input-error');
            }

            // Validate Phone
            const phone = document.getElementById('phone');
            const phoneRegex = /^\\d{10}$/; // simple 10 digit validation
            if (!phoneRegex.test(phone.value.replace(/\\D/g, ''))) {
                document.getElementById('phoneError').style.display = 'block';
                phone.classList.add('input-error');
                isValid = false;
            } else {
                document.getElementById('phoneError').style.display = 'none';
                phone.classList.remove('input-error');
            }

            // Validate Date
            const date = document.getElementById('date');
            if (!date.value || date.value < today) {
                document.getElementById('dateError').style.display = 'block';
                date.classList.add('input-error');
                isValid = false;
            } else {
                document.getElementById('dateError').style.display = 'none';
                date.classList.remove('input-error');
            }

            // Validate Time
            const time = document.getElementById('time');
            if (!time.value) {
                document.getElementById('timeError').style.display = 'block';
                time.classList.add('input-error');
                isValid = false;
            } else {
                document.getElementById('timeError').style.display = 'none';
                time.classList.remove('input-error');
            }

            // Validate Service
            const service = document.getElementById('service');
            if (!service.value) {
                document.getElementById('serviceError').style.display = 'block';
                service.classList.add('input-error');
                isValid = false;
            } else {
                document.getElementById('serviceError').style.display = 'none';
                service.classList.remove('input-error');
            }

            if (isValid) {
                // Pass form data via URL params
                const params = new URLSearchParams({
                    name: name.value,
                    date: date.value,
                    time: time.value,
                    service: service.value
                });
                
                window.location.href = 'BookNow.html?' + params.toString();
            }
        });
    </script>
</body>
</html>
